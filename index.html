<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A cheerful gallery of cats.">
  <title>Whisker Gallery</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <span class="paw" aria-hidden="true">🐾</span>
    <h1>Cozy Cat Gallery</h1>
    <p>A small collection of curious faces, soft paws, and excellent naps.</p>
  </header>

  <main>
    <section class="gallery" aria-label="Cat pictures">
      <figure>
        <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&amp;fit=crop&amp;w=900&amp;q=85" alt="Gray and white cat looking at the camera" loading="lazy">
        <figcaption>Midnight Observer <span>Always watching, rarely judging.</span></figcaption>
      </figure>
      <figure>
        <img src="https://images.unsplash.com/photo-1574158622682-e40e69881006?auto=format&amp;fit=crop&amp;w=900&amp;q=85" alt="Orange cat sitting indoors" loading="lazy">
        <figcaption>Sunbeam Expert <span>Specialist in finding the warmest spot.</span></figcaption>
      </figure>
      <figure>
        <img src="https://images.unsplash.com/photo-1533738363-b7f9aef128ce?auto=format&amp;fit=crop&amp;w=900&amp;q=85" alt="Black and white cat with bright eyes" loading="lazy">
        <figcaption>Little Explorer <span>Every box is an exciting adventure.</span></figcaption>
      </figure>
      <figure>
        <img src="https://images.unsplash.com/photo-1592194996308-7b43878e84a6?auto=format&amp;fit=crop&amp;w=900&amp;q=85" alt="Fluffy tabby cat resting" loading="lazy">
        <figcaption>Professional Napper <span>Available for cuddles after naptime.</span></figcaption>
      </figure>
      <figure>
        <img src="https://images.unsplash.com/photo-1519052537078-e6302a4968d4?auto=format&amp;fit=crop&amp;w=900&amp;q=85" alt="Tabby cat sitting on a chair" loading="lazy">
        <figcaption>Window Seat VIP <span>Front-row access to the outside world.</span></figcaption>
      </figure>
      <figure>
        <img src="https://images.unsplash.com/photo-1561948955-570b270e7c36?auto=format&amp;fit=crop&amp;w=900&amp;q=85" alt="White and gray cat lying down" loading="lazy">
        <figcaption>Quiet Dreamer <span>Probably dreaming about treats.</span></figcaption>
      </figure>
      <figure>
        <img src="https://images.unsplash.com/photo-1495360010541-f48722b34f7d?auto=format&amp;fit=crop&amp;w=900&amp;q=85" alt="Gray cat resting on a blanket" loading="lazy">
        <figcaption>Cozy Lounger <span>Living proof that blankets are essential.</span></figcaption>
      </figure>
      <figure>
        <img src="https://images.unsplash.com/photo-1513245543132-31f507417b26?auto=format&amp;fit=crop&amp;w=900&amp;q=85" alt="Cat looking up from the floor" loading="lazy">
        <figcaption>Ceiling Inspector <span>Checking for mysterious noises overhead.</span></figcaption>
      </figure>
      <figure>
        <img src="https://images.unsplash.com/photo-1494256997604-768d1f608cac?auto=format&amp;fit=crop&amp;w=900&amp;q=85" alt="Close-up of a fluffy cat" loading="lazy">
        <figcaption>Fluffy Celebrity <span>Ready for a close-up at any moment.</span></figcaption>
      </figure>
      <figure>
        <img src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131?auto=format&amp;fit=crop&amp;w=900&amp;q=85" alt="Orange and white cat sitting outside" loading="lazy">
        <figcaption>Garden Guardian <span>Protecting the flowers from invisible enemies.</span></figcaption>
      </figure>
      <figure>
        <img src="https://images.unsplash.com/photo-1573865526739-10659fec78a5?auto=format&amp;fit=crop&amp;w=900&amp;q=85" alt="Striped cat sitting indoors" loading="lazy">
        <figcaption>Striped Philosopher <span>Has several important thoughts about dinner.</span></figcaption>
      </figure>
      <figure>
        <img src="https://images.unsplash.com/photo-1543852786-1cf6624b9987?auto=format&amp;fit=crop&amp;w=900&amp;q=85" alt="Cat with green eyes looking at the camera" loading="lazy">
        <figcaption>Green-Eyed Charmer <span>Wins every staring contest.</span></figcaption>
      </figure>
    </section>
  </main>

  <footer>
    Made with curiosity and a little bit of cat hair.
  </footer>
</body>
</html>
